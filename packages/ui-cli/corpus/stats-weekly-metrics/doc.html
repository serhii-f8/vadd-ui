<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Storefront — week 45</title>
<style>
  body { margin: 0; padding: 16px; background: var(--background, #fff); color: var(--foreground, #171717); font-family: var(--font-sans, system-ui, sans-serif); font-size: 14px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .tile { border: 1px solid var(--border, #e5e5e5); border-radius: var(--radius, 8px); padding: 12px; background: var(--card, #fff); }
  .label { font-size: 12px; color: var(--muted-foreground, #737373); }
  .value { font-size: 22px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .delta { font-size: 12px; margin-top: 2px; }
  .up { color: var(--chart-2, #16a34a); }
  .down { color: var(--destructive, #dc2626); }
  .warn { border-color: var(--chart-4, #d97706); }
  .warn .value { color: var(--chart-4, #d97706); }
  .good .value { color: var(--chart-2, #16a34a); }
</style>
</head>
<body>
<h1>Storefront — week 45</h1>
<div class="tiles">
  <div class="tile"><div class="label">Orders</div><div class="value">18,420</div><div class="delta up">▲ 6.4%</div></div>
  <div class="tile"><div class="label">Revenue</div><div class="value">€412,380</div><div class="delta up">▲ 5.2%</div></div>
  <div class="tile"><div class="label">Conversion</div><div class="value">3.1%</div><div class="delta down">▼ 0.2%</div></div>
  <div class="tile"><div class="label">Avg order</div><div class="value">€22.39</div><div class="delta down">▼ 1.1%</div></div>
  <div class="tile warn"><div class="label">p95 checkout</div><div class="value">840 ms</div></div>
  <div class="tile good"><div class="label">Error rate</div><div class="value">0.42%</div></div>
</div>
</body>
</html>
