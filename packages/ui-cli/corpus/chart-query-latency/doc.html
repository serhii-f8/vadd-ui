<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Catalog query latency</title>
<style>
  body { margin: 0; padding: 16px; background: var(--background, #fff); color: var(--foreground, #171717); font-family: var(--font-sans, system-ui, sans-serif); font-size: 14px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  svg { width: 100%; height: auto; display: block; }
  .grid line { stroke: var(--border, #e5e5e5); }
  .axis text { fill: var(--muted-foreground, #737373); font-size: 11px; }
  .p50 { fill: none; stroke: var(--chart-1, #2563eb); stroke-width: 2; }
  .p95 { fill: none; stroke: var(--chart-2, #16a34a); stroke-width: 2; }
  .slo { stroke: var(--destructive, #dc2626); stroke-dasharray: 4 3; }
  .slo-label { fill: var(--destructive, #dc2626); font-size: 11px; }
  .legend { display: flex; gap: 16px; margin-top: 8px; font-size: 12px; color: var(--muted-foreground, #737373); }
  .legend span::before { content: ""; display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
  .legend .l50::before { background: var(--chart-1, #2563eb); }
  .legend .l95::before { background: var(--chart-2, #16a34a); }
</style>
</head>
<body>
<h1>Catalog query latency</h1>
<svg viewBox="0 0 640 260" role="img" aria-label="p50 and p95 latency in ms from 10:00 to 10:35, SLO 100 ms">
  <g class="grid">
    <line x1="48" y1="20" x2="624" y2="20"/>
    <line x1="48" y1="80" x2="624" y2="80"/>
    <line x1="48" y1="140" x2="624" y2="140"/>
    <line x1="48" y1="200" x2="624" y2="200"/>
  </g>
  <g class="axis">
    <text x="40" y="24" text-anchor="end">180 ms</text>
    <text x="40" y="84" text-anchor="end">120 ms</text>
    <text x="40" y="144" text-anchor="end">60 ms</text>
    <text x="40" y="204" text-anchor="end">0 ms</text>
    <text x="48" y="220" text-anchor="middle">10:00</text>
    <text x="130" y="220" text-anchor="middle">10:05</text>
    <text x="213" y="220" text-anchor="middle">10:10</text>
    <text x="295" y="220" text-anchor="middle">10:15</text>
    <text x="377" y="220" text-anchor="middle">10:20</text>
    <text x="459" y="220" text-anchor="middle">10:25</text>
    <text x="542" y="220" text-anchor="middle">10:30</text>
    <text x="624" y="220" text-anchor="middle">10:35</text>
  </g>
  <line class="slo" x1="48" y1="100" x2="624" y2="100"/>
  <text class="slo-label" x="620" y="94" text-anchor="end">SLO</text>
  <polyline class="p50" points="48,158 130,160 213,155 295,159 377,161 459,156 542,157 624,160"/>
  <polyline class="p95" points="48,80 130,20 213,105 295,112 377,116 459,69 542,103 624,110"/>
</svg>
<div class="legend"><span class="l50">p50</span><span class="l95">p95</span></div>
</body>
</html>
