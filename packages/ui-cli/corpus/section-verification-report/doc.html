<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Objective #14 — refresh-token rotation</title>
<style>
  body { margin: 0; padding: 16px; background: var(--background, #fff); color: var(--foreground, #171717); font-family: var(--font-sans, system-ui, sans-serif); font-size: 14px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  h2 { font-size: 14px; font-weight: 600; margin: 16px 0 8px; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .tile { border: 1px solid var(--border, #e5e5e5); border-radius: var(--radius, 8px); padding: 10px; background: var(--card, #fff); }
  .label { font-size: 12px; color: var(--muted-foreground, #737373); }
  .value { font-size: 20px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .delta { font-size: 12px; color: var(--destructive, #dc2626); }
  .warn .value { color: var(--chart-4, #d97706); }
  .check { display: flex; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--border, #e5e5e5); }
  .check .time { margin-left: auto; color: var(--muted-foreground, #737373); font-size: 12px; }
  .ok .icon { color: var(--chart-2, #16a34a); }
  .fail .icon { color: var(--destructive, #dc2626); }
  pre { margin: 4px 0 0; padding: 6px 8px; background: var(--muted, #f5f5f5); border-radius: 6px; font-family: var(--font-mono, ui-monospace, monospace); font-size: 12px; }
  .callout { margin-top: 12px; border-left: 3px solid var(--chart-4, #d97706); background: color-mix(in srgb, var(--chart-4, #d97706) 10%, transparent); padding: 8px 12px; border-radius: 4px; }
</style>
</head>
<body>
<h1>Objective #14 — refresh-token rotation</h1>
<div class="tiles">
  <div class="tile warn"><div class="label">Checks</div><div class="value">5/6</div></div>
  <div class="tile"><div class="label">Tests</div><div class="value">142</div><div class="delta">▼ 3</div></div>
  <div class="tile"><div class="label">Coverage</div><div class="value">87.4%</div></div>
  <div class="tile"><div class="label">Duration</div><div class="value">48.2 s</div></div>
</div>
<h2>Checks</h2>
<div class="check ok"><span class="icon">✓</span><span>Typecheck</span><span class="time">9.1 s</span></div>
<div class="check ok"><span class="icon">✓</span><span>Unit tests</span><span class="time">21.4 s</span></div>
<div class="check fail"><span class="icon">✕</span><div><span>E2E</span><pre>auth.spec.ts:88  expected 401, got 200</pre></div><span class="time">17.7 s</span></div>
<div class="callout">E2E fails on expired-token replay. Rotation is not invalidating the old token.</div>
</body>
</html>
