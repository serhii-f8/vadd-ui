<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Rotation — plan and changes</title>
<style>
  body { margin: 0; padding: 16px; background: var(--background, #fff); color: var(--foreground, #171717); font-family: var(--font-sans, system-ui, sans-serif); font-size: 14px; }
  h1 { font-size: 16px; font-weight: 600; margin: 0 0 12px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); gap: 12px; }
  .panel { border: 1px solid var(--border, #e5e5e5); border-radius: var(--radius, 8px); padding: 12px; background: var(--card, #fff); }
  h2 { font-size: 14px; font-weight: 600; margin: 0 0 8px; }
  h2 small { font-weight: 400; color: var(--muted-foreground, #737373); }
  ul { list-style: none; margin: 0; padding: 0; }
  li { padding: 3px 0; }
  .ok::before { content: "✓ "; color: var(--chart-2, #16a34a); }
  .run::before { content: "◐ "; color: var(--chart-1, #2563eb); }
  .wait::before { content: "○ "; color: var(--muted-foreground, #a3a3a3); }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  td { padding: 4px 6px; border-bottom: 1px solid var(--border, #e5e5e5); }
  td.path { font-family: var(--font-mono, ui-monospace, monospace); }
  td.num { text-align: right; font-variant-numeric: tabular-nums; }
  .add { color: var(--chart-2, #16a34a); }
  .del { color: var(--destructive, #dc2626); }
</style>
</head>
<body>
<h1>Rotation — plan and changes</h1>
<div class="grid">
  <div class="panel">
    <h2>Plan <small>1/3</small></h2>
    <ul>
      <li class="ok">Add rotation table</li>
      <li class="run">Invalidate on refresh</li>
      <li class="wait">Replay protection test</li>
    </ul>
  </div>
  <div class="panel">
    <h2>Changes</h2>
    <table>
      <tr><td>M</td><td class="path">src/auth/refresh.ts</td><td class="num add">+64</td><td class="num del">−12</td></tr>
      <tr><td>A</td><td class="path">src/auth/rotation.repo.ts</td><td class="num add">+88</td><td class="num del">−0</td></tr>
      <tr><td>A</td><td class="path">migrations/0042_token_rotation.sql</td><td class="num add">+21</td><td class="num del">−0</td></tr>
    </table>
  </div>
</div>
</body>
</html>
